name: CI

# Single consolidated pipeline for all 3 feature files (replaces the previous
# bdd-tests.yml, integration-tests.yml, azure-portal-e2e.yml, live-tests.yml,
# playwright.yml). copilot-setup-steps.yml stays separate - it's the special
# file GitHub's Copilot coding agent uses to prep its own sandbox, not a test job.
#
# Microsoft auth is handled so that nothing in this pipeline can expire:
#
#   Service Bus / Blob (machine-to-machine) -> GitHub OIDC federated identity. The job
#   requests a short-lived token from GitHub and exchanges it with Entra at run time. There
#   is no stored secret and no session, so it cannot go stale. Client secrets are still
#   accepted as a fallback, but they expire (max 24 months) and OIDC is preferred.
#
#   Azure Portal UI (user sign-in) -> TOTP. A real MFA code is generated per run from
#   TOTP_SECRET (specs/support/totp.js, RFC 6238), so there is no captured session to
#   refresh. The old storage-state path is local-development only; CI refuses it because it
#   expires within hours and would guarantee a red build eventually.
#
# All test jobs therefore run on every push/PR. Credential-dependent jobs are gated on the
# "preflight" job, which reports which secrets are configured, so an unconfigured job is
# SKIPPED (a skipped job does not fail the run) instead of failing on missing credentials.
# This indirection is required because the "secrets" context is NOT available in "if:".
# Nothing uses continue-on-error: a failing test always fails its job.
#
# Environment-specific config (Service Bus namespace, storage account, queue
# names, sibling-repo ref, Azure credentials) is read from a GitHub Environment
# (Settings > Environments) via the "environment" input, so the same jobs can
# target dev/stage/prod later just by adding environments with the same
# variable/secret names and different values. Only "dev" exists today - add
# "stage"/"prod" GitHub Environments when those are ready, no workflow changes needed.
run-name: "CI (${{ inputs.environment || 'dev' }} environment)"

# Required for the OIDC token request; contents:read is the usual companion.
permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 10:00 AM IST (04:30 UTC).
    - cron: '30 4 * * *'
    # 6:20 PM IST (12:50 UTC).
    - cron: '50 12 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (source of vars/secrets)'
        type: choice
        options: [ dev, stage, prod ]
        default: dev
      run_live_pipeline:
        description: 'Also run Live Pipeline Test - publishes a real Service Bus message'
        type: boolean
        default: false

jobs:
  unit:
    name: "Unit Tests [${{ inputs.environment || 'dev' }}]"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  bdd:
    name: "BDD Tests (Cucumber) [${{ inputs.environment || 'dev' }}]"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # Parses every feature file and binds each step to a definition without executing
      # anything. Catches undefined/ambiguous/renamed steps - the failure a push can
      # actually introduce - with no Azure or MCP dependency.
      - name: Validate all feature files (dry run)
        run: npm run test:validate
      # Non-@integration scenarios only - no live Azure/MCP dependencies required
      - name: Run BDD scenarios
        run: |
          mkdir -p reports
          npx cucumber-js specs --require specs/support --require specs/steps --tags "not @integration" --format json:reports/cucumber-report.json
      - name: Generate HTML report
        if: ${{ !cancelled() }}
        run: node scripts/generate-report.js
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cucumber-bdd-report
          path: reports/
          retention-days: 30

  preflight:
    name: "Preflight (detect configured credentials) [${{ inputs.environment || 'dev' }}]"
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      has_azure: ${{ steps.check.outputs.has_azure }}
      has_data_access: ${{ steps.check.outputs.has_data_access }}
      has_org_token: ${{ steps.check.outputs.has_org_token }}
      has_sas: ${{ steps.check.outputs.has_sas }}
    steps:
      # Secrets can't be read in "if:" conditions, but they can be read as step env vars,
      # so their presence is converted into job outputs for downstream jobs to gate on.
      - id: check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET || vars.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
          SERVICE_BUS_CONNECTION: ${{ secrets.SERVICE_BUS_CONNECTION }}
          STORAGE_SAS_URL: ${{ secrets.STORAGE_SAS_URL }}
          STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
          SERVICE_BUS_SAS_KEY_COPE_REQUESTS: ${{ secrets.SERVICE_BUS_SAS_KEY_COPE_REQUESTS }}
          SERVICE_BUS_SAS_KEY_COPE_REQUESTS_DEV: ${{ secrets.SERVICE_BUS_SAS_KEY_COPE_REQUESTS_DEV }}
          SERVICE_BUS_LISTEN_CONNECTION: ${{ secrets.SERVICE_BUS_LISTEN_CONNECTION }}
        run: |
          # Federated identity - preferred, nothing stored and nothing expires.
          has_azure=false
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ]; then
            has_azure=true
          elif [ -n "$AZURE_CREDENTIALS" ]; then
            has_azure=true
          fi

          # Shared-secret fallback for tenants where app registration/RBAC needs an admin.
          has_shared_secret=false
          if [ -n "$SERVICE_BUS_CONNECTION" ] && { [ -n "$STORAGE_SAS_URL" ] || [ -n "$STORAGE_CONNECTION_STRING" ]; }; then
            has_shared_secret=true
          fi

          has_data_access=false
          if [ "$has_azure" = "true" ] || [ "$has_shared_secret" = "true" ]; then
            has_data_access=true
          fi

          # Presence alone is not enough: checkout needs read access to both
          # private sibling repositories.
          has_org_token=false
          if [ -n "$GH_TOKEN" ]; then
            has_org_token=true
            for repo in allata-llc/mcp-server allata-llc/pipeline-function; do
              if ! gh api "repos/$repo/contents" >/dev/null 2>&1; then
                has_org_token=false
                break
              fi
            done
          fi

          # Queue-scoped "bulk-send-key" primary keys, one per queue. The Send claim cannot
          # peek, and SERVICE_BUS_CONNECTION here is an entity-scoped send-only string, so the
          # peek-back assertion needs its own namespace-level Listen credential.
          has_sas=false
          if [ -n "$SERVICE_BUS_SAS_KEY_COPE_REQUESTS" ] \
            && [ -n "$SERVICE_BUS_SAS_KEY_COPE_REQUESTS_DEV" ] \
            && { [ -n "$SERVICE_BUS_LISTEN_CONNECTION" ] || [ "$has_azure" = "true" ]; }; then
            has_sas=true
          fi

          {
            echo "has_azure=$has_azure"
            echo "has_data_access=$has_data_access"
            echo "has_org_token=$has_org_token"
            echo "has_sas=$has_sas"
          } >> "$GITHUB_OUTPUT"

          {
            echo "| Credential set | Configured |"
            echo "| --- | --- |"
            echo "| Azure federated identity (OIDC) | $has_azure |"
            echo "| Connection string / SAS fallback | $has_shared_secret |"
            echo "| Azure data-plane access (either of the above) | $has_data_access |"
            echo "| ORG_REPO_TOKEN (read access to both private sibling repos) | $has_org_token |"
            echo "| Service Bus bulk-send-key SAS keys | $has_sas |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$has_data_access" != "true" ]; then
            echo "::warning::No Azure data-plane credentials configured - the Azure jobs will be skipped. Set AZURE_CLIENT_ID/AZURE_TENANT_ID (OIDC), or SERVICE_BUS_CONNECTION plus STORAGE_SAS_URL."
          fi
          if [ "$has_org_token" != "true" ]; then
            echo "::warning::Integration tests will be skipped. Configure ORG_REPO_TOKEN with read access to allata-llc/mcp-server and allata-llc/pipeline-function."
          fi

  integration:
    name: "Integration Tests (MCP server + pipeline-function) [${{ inputs.environment || 'dev' }}]"
    # Requires the ORG_REPO_TOKEN secret (read access to the private
    # allata-llc/mcp-server and allata-llc/pipeline-function repos). Skips - does not
    # fail - when that token isn't available, e.g. on fork PRs.
    needs: preflight
    if: ${{ needs.preflight.outputs.has_org_token == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout AgenticAI
        uses: actions/checkout@v4
        with:
          path: agenticai

      - name: Checkout mcp-server
        uses: actions/checkout@v4
        with:
          repository: allata-llc/mcp-server
          ref: ${{ vars.SIBLING_REPO_REF || 'develop' }}
          token: ${{ secrets.ORG_REPO_TOKEN }}
          path: mcp-server

      - name: Checkout pipeline-function
        uses: actions/checkout@v4
        with:
          repository: allata-llc/pipeline-function
          ref: ${{ vars.SIBLING_REPO_REF || 'develop' }}
          token: ${{ secrets.ORG_REPO_TOKEN }}
          path: pipeline-function

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Install AgenticAI dependencies
        working-directory: agenticai
        run: npm ci

      - name: Install mcp-server Python dependencies
        working-directory: mcp-server
        run: pip install -r requirements.txt

      - name: Write mcp-server local.settings.json
        working-directory: mcp-server
        run: |
          cat > local.settings.json << 'EOF'
          {
            "IsEncrypted": false,
            "Values": {
              "FUNCTIONS_WORKER_RUNTIME": "python"
            }
          }
          EOF

      - name: Start mcp-server Functions host
        working-directory: mcp-server
        run: |
          nohup func start > func.log 2>&1 &
          echo "Waiting for mcp-server host on :7071..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:7071/; then
              echo "mcp-server is up"
              exit 0
            fi
            sleep 2
          done
          echo "mcp-server did not start in time"
          cat func.log
          exit 1

      - name: Run MCP server integration tests
        working-directory: agenticai
        run: npm run test:integration:mcp

      - name: Run pipeline-function integration tests (non-live)
        working-directory: agenticai
        env:
          PIPELINE_FUNCTION_REPO: ../pipeline-function
        run: npm run test:integration:pipeline

      - name: Show mcp-server logs
        if: ${{ !cancelled() }}
        working-directory: mcp-server
        run: cat func.log || true

  cope-pipeline-e2e:
    name: "Cope Pipeline E2E (headless, Azure SDK) [${{ inputs.environment || 'dev' }}]"
    # Runs on every push/PR. Same end-to-end path as azure-portal-e2e (Service Bus -> Foundry
    # -> Blob) but driven straight through the Azure SDK with federated (OIDC) auth: no
    # browser, no user sign-in, no MFA, no stored secret, nothing that can expire. This is the
    # job that actually proves the pipeline works; azure-portal-e2e only adds UI coverage.
    needs: preflight
    if: ${{ needs.preflight.outputs.has_data_access == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci

      - name: Run Cope pipeline E2E (headless)
        env:
          # OIDC: the token is requested from GitHub and exchanged with Entra at run time.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          # No-admin-required fallback.
          SERVICE_BUS_CONNECTION: ${{ secrets.SERVICE_BUS_CONNECTION }}
          STORAGE_SAS_URL: ${{ secrets.STORAGE_SAS_URL }}
          STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
          # Environment-specific resource names (Settings > Environments > Variables)
          SERVICE_BUS_NAMESPACE_FQDN: ${{ vars.SERVICE_BUS_NAMESPACE_FQDN || 'cope-pocsb.servicebus.windows.net' }}
          STORAGE_ACCOUNT_URL: ${{ vars.STORAGE_ACCOUNT_URL || 'https://copepocsa.blob.core.windows.net' }}
          COPE_QUEUE_NAME: ${{ vars.COPE_QUEUE_NAME || 'cope-requests' }}
        run: npm run test:integration:cope-e2e

  cope-sas:
    name: "Cope SAS over REST (bulk-send-key) [${{ inputs.environment || 'dev' }}]"
    # Signs a queue-scoped SAS token locally and publishes over plain HTTP - the headless
    # equivalent of copying bulk-send-key out of the portal. Skips (does not fail) when the
    # per-queue keys are not configured, since they are queue-scoped shared secrets.
    needs: preflight
    if: ${{ needs.preflight.outputs.has_sas == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci

      - name: Run SAS-over-REST scenarios
        env:
          SERVICE_BUS_NAMESPACE_FQDN: ${{ vars.SERVICE_BUS_NAMESPACE_FQDN || 'cope-pocsb.servicebus.windows.net' }}
          SERVICE_BUS_SAS_KEY_NAME: ${{ vars.SERVICE_BUS_SAS_KEY_NAME || 'bulk-send-key' }}
          SERVICE_BUS_SAS_KEY_COPE_REQUESTS: ${{ secrets.SERVICE_BUS_SAS_KEY_COPE_REQUESTS }}
          SERVICE_BUS_SAS_KEY_COPE_REQUESTS_DEV: ${{ secrets.SERVICE_BUS_SAS_KEY_COPE_REQUESTS_DEV }}
          # Peeking needs Listen, which bulk-send-key does not grant.
          SERVICE_BUS_LISTEN_CONNECTION: ${{ secrets.SERVICE_BUS_LISTEN_CONNECTION }}
          SERVICE_BUS_CONNECTION: ${{ secrets.SERVICE_BUS_CONNECTION }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
        run: npm run test:integration:cope-sas

  live-pipeline:
    name: "Live Pipeline Test (manual, hits real Service Bus) [${{ inputs.environment || 'dev' }}]"
    # Publishes a real message to the Service Bus queue. Manual-only - never runs
    # automatically. Uses the same OIDC federated identity as the other Azure jobs, or a
    # SERVICE_BUS_CONNECTION string if one is configured.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_pipeline }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Publish live property request to Service Bus
        env:
          SERVICE_BUS_CONNECTION: ${{ secrets.SERVICE_BUS_CONNECTION }}
          SERVICE_BUS_NAMESPACE_FQDN: ${{ vars.SERVICE_BUS_NAMESPACE_FQDN || 'cope-pocsb.servicebus.windows.net' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          PIPELINE_QUEUE_NAME: ${{ vars.COPE_QUEUE_NAME || 'cope-requests' }}
        run: npm run test:integration:pipeline:live
